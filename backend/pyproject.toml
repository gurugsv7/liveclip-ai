[project]
name = "liveclip"
version = "0.1.0"
description = "LiveClip AI - local-first multi-stream AI clipping command center"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "websockets>=12",
  "psutil>=5.9",
  "numpy>=1.26",
  "streamlink>=6.7",
]

[project.optional-dependencies]
ai = [
  "faster-whisper>=1.0.3",
]
vision = [
  "opencv-python-headless>=4.9,<5",   # v5 dropped the Haar cascade face detector
]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "media: tests that need ffmpeg/ffprobe on PATH or configured",
  "soak: long-running soak tests (opt-in)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["liveclip*"]
